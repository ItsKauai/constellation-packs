<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MC Constellation invite</title>
<meta name="robots" content="noindex">
<style>
  :root { --accent: #7C8CFF; --fill: #636DD2; --night: #0B0820; --panel: #151126; --edge: #3A3058; --ink: #E8E6F4; --dim: #9A93B4; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse at 30% 30%, #2a1c5c 0%, transparent 55%),
                radial-gradient(ellipse at 80% 80%, #3b1f4f 0%, transparent 50%),
                linear-gradient(160deg, var(--night), #1C1040);
    color: var(--ink); font-family: "Inter", "Segoe UI", system-ui, sans-serif;
    display: grid; place-items: center; padding: 16px;
  }
  .card {
    width: min(460px, 100%); padding: 32px 28px; border-radius: 24px;
    background: color-mix(in srgb, var(--panel) 70%, transparent);
    backdrop-filter: blur(22px) saturate(150%); -webkit-backdrop-filter: blur(22px) saturate(150%);
    border: 1px solid color-mix(in srgb, var(--edge) 75%, transparent);
    box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.07), 0 8px 48px -10px rgb(0 0 0 / 0.45);
    text-align: center;
  }
  .star { width: 56px; height: 56px; margin: 0 auto 18px; }
  h1 { font-size: 22px; margin: 0 0 8px; font-weight: 650; }
  p { color: var(--dim); font-size: 14px; line-height: 1.5; margin: 0 0 22px; }
  a.button {
    display: inline-block; padding: 12px 22px; border-radius: 12px; background: var(--fill); color: #fff;
    text-decoration: none; font-weight: 600; font-size: 15px; transition: background .15s, transform .15s;
  }
  a.button:hover { background: var(--accent); transform: translateY(-1px); }
  .small { margin-top: 18px; font-size: 12px; color: var(--dim); }
</style>
</head>
<body>
<main class="card">
  <svg class="star" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 6 C34 26 38 30 58 32 C38 34 34 38 32 58 C30 38 26 34 6 32 C26 30 30 26 32 6 Z" fill="#7C8CFF"/></svg>
  <h1 id="title">You're invited</h1>
  <p id="text">Opening MC Constellation...</p>
  <a class="button" id="open" href="#">Open MC Constellation</a>
  <div class="small">Nothing happens? MC Constellation isn't installed on this computer yet: ask whoever sent this link.</div>
</main>
<script>
  // The invite's details come from the link. They're only shown as text (never as HTML) and passed on unchanged.
  const q = new URLSearchParams(location.search);
  const pack = q.get("pack") || "";
  const name = q.get("name") || "";
  if (/^[a-z0-9-]{1,48}$/.test(pack)) {
    document.getElementById("title").textContent = (name ? name + " invited you" : "You're invited") + " to " + pack;
    document.getElementById("text").textContent = "MC Constellation will ask you before it sets anything up.";
    const app = "mcconstellation://invite?" + q.toString();
    document.getElementById("open").href = app;
    setTimeout(() => { location.href = app; }, 600);
  } else {
    document.getElementById("title").textContent = "This invite link isn't complete";
    document.getElementById("text").textContent = "Ask for a new one.";
    document.getElementById("open").style.display = "none";
  }
</script>
</body>
</html>
